<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brandon's AI Gifts for You</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2712%27 cy=%2712%27 r=%2712%27 fill=%27%23c9a96a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{
  --bg:#121214; --surface:#19191c; --line:#2c2c31; --rule:#26262b; --line-soft:#232327;
  --fg:#ebe6dc; --muted:#8f8b84; --faint:#5f5c58;
  --gold:#c9a96a; --gold-soft:rgba(201,169,106,.14); --ok:#8fae8b; --warn:#d38b6f;
  --sky-top:#0d0d10; --sky-mid:#3a2618; --sun:#f0b46a; --hill:#0f0f11;
  --display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --body:"Hanken Grotesk",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#eceae6; --surface:#f8f7f4; --line:#d9d6d0; --rule:#dcd9d3; --line-soft:#e6e3de;
  --fg:#1d1c1a; --muted:#6c6862; --faint:#a29e97;
  --gold:#8f6f32; --gold-soft:rgba(143,111,50,.12); --ok:#4f7a4b; --warn:#a85a3c;
  --sky-top:#2a2420; --sky-mid:#8a5a34; --sun:#ffd08a; --hill:#1d1a17;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#eceae6; --surface:#f8f7f4; --line:#d9d6d0; --rule:#dcd9d3; --line-soft:#e6e3de;
  --fg:#1d1c1a; --muted:#6c6862; --faint:#a29e97;
  --gold:#8f6f32; --gold-soft:rgba(143,111,50,.12); --ok:#4f7a4b; --warn:#a85a3c;
  --sky-top:#2a2420; --sky-mid:#8a5a34; --sun:#ffd08a; --hill:#1d1a17;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:1.5px solid var(--gold);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}

.banner{position:relative;height:clamp(140px,22vw,210px);overflow:hidden;
  background:radial-gradient(60% 120% at 68% 100%,var(--sun) 0%,rgba(240,180,106,.35) 22%,transparent 55%),linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 78%,var(--sun) 100%)}
.banner svg{position:absolute;inset:auto 0 0 0;width:100%;height:58%}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,var(--bg) 100%)}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.banner.has-photo{height:clamp(190px,27vw,340px);background:var(--bg)}
.banner.has-photo svg{display:none}

.wrap{max-width:1180px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px))}
.head{display:flex;align-items:flex-end;gap:20px;margin-top:-54px;position:relative;z-index:1;flex-wrap:wrap}
.medal{--m:var(--gold);width:104px;height:104px;flex:none;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(130% 130% at 28% 18%,color-mix(in srgb,var(--m) 30%,#fff) 0%,var(--m) 40%,color-mix(in srgb,var(--m) 52%,#000) 100%);
  box-shadow:inset 0 1px 0 color-mix(in srgb,var(--m) 25%,#fff),inset 0 -3px 6px color-mix(in srgb,var(--m) 35%,#000),0 0 0 1px color-mix(in srgb,var(--m) 45%,#000),0 10px 30px rgba(0,0,0,.35);
  color:color-mix(in srgb,var(--m) 22%,#000)}
.medal svg{width:46px;height:46px;filter:drop-shadow(0 1px 0 color-mix(in srgb,var(--m) 45%,#fff))}
.titles{flex:1;min-width:220px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
h1{font:500 clamp(36px,5.6vw,58px)/1 var(--display);margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.status{display:flex;gap:10px;align-items:center}
.pill-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted);font-size:12px;text-decoration:none;white-space:nowrap}
.pill-btn:hover{border-color:var(--gold);color:var(--gold)}
.lede{max-width:640px;margin:18px 0 0;color:var(--muted);font-size:15px}
.lede em{font:italic 19px/1.3 var(--display);color:var(--fg)}

.bar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin:26px -16px 0;padding:12px 16px 10px;border-bottom:1px solid var(--line-soft)}
.bar-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--faint)}
.search input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 34px 8px 34px;font-size:14px}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--gold)}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:26px;border-radius:50%}
.seg-ctl{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:2px}
.seg-ctl button{background:none;border:0;border-radius:999px;padding:5px 13px;font-size:12px;color:var(--muted);cursor:pointer}
.seg-ctl button.on{background:var(--gold);color:var(--bg)}
.count{font:400 12px var(--mono);color:var(--faint);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:10px;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:none;border:1px solid var(--line-soft);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip b{font:400 10px var(--mono);color:var(--faint);margin-left:5px}
.chip:hover{color:var(--fg);border-color:var(--line)}
.chip.on{border-color:var(--gold);color:var(--gold);background:var(--gold-soft)}
.chip.on b{color:var(--gold)}

section.cat{margin-top:44px;content-visibility:auto;contain-intrinsic-size:auto 900px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--line-soft);padding-bottom:8px;flex-wrap:wrap}
h2{font:500 28px/1.1 var(--display);margin:0;text-wrap:balance}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;padding:16px 18px 12px;display:flex;flex-direction:column;min-width:0;transition:border-color .18s,transform .18s,box-shadow .18s}
.card:hover{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.22)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.card h3{font:500 23px/1.1 var(--display);margin:0;overflow-wrap:anywhere}
.price{flex:none;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor;border-radius:999px;padding:2px 8px;white-space:nowrap;margin-top:3px}
.price.free{color:var(--ok)}.price.freemium{color:var(--gold)}.price.paid{color:var(--warn)}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:6px 0 0}
.desc{color:var(--muted);font-size:14px;margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kw{display:flex;flex-wrap:wrap;gap:4px 10px;margin-bottom:12px;font:400 11px var(--mono);color:var(--faint)}
.card-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--rule);padding-top:10px}
.domain{font:400 11px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.visit{flex:none;font-size:12.5px;font-weight:500;color:var(--gold);text-decoration:none;border-bottom:1px solid transparent}
.visit:hover{border-bottom-color:var(--gold)}

.empty{text-align:center;padding:70px 0;color:var(--muted)}
.empty p{font:italic 26px var(--display);color:var(--fg);margin:0 0 8px}
.link-btn{background:none;border:0;padding:0;color:var(--gold);cursor:pointer;font-size:14px;text-decoration:underline;text-underline-offset:3px}
footer{margin-top:64px;font-size:12px;color:var(--faint);text-align:center}
footer a{color:var(--muted)}
@media (max-width:760px){.head{margin-top:-40px;gap:14px}.medal{width:80px;height:80px}.medal svg{width:36px;height:36px}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="photoTheme"></style>
<script>try{const t=localStorage.getItem("life-planner-shared-v1-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<div class="banner" id="banner" aria-hidden="true">
  <img id="bannerImg" alt="" hidden>
  <svg viewBox="0 0 1200 140" preserveAspectRatio="none">
    <path fill="var(--hill)" opacity=".55" d="M0 90 C180 60 300 72 460 64 S760 40 900 62 1100 78 1200 70 V140 H0Z"/>
    <path fill="var(--hill)" d="M0 112 C160 96 340 104 520 98 S860 88 1000 100 1140 108 1200 104 V140 H0Z"/>
  </svg>
</div>

<div class="wrap">
  <header class="head">
    <div class="medal" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8.5" width="18" height="4" rx="1"/><path d="M5 12.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7.5M12 8.5V21"/><path d="M12 8.5C10.5 5 7.5 4.2 6.6 5.6c-.9 1.5 1.4 2.9 5.4 2.9ZM12 8.5c1.5-3.5 4.5-4.3 5.4-2.9.9 1.5-1.4 2.9-5.4 2.9Z"/></svg></div>
    <div class="titles">
      <div class="eyebrow" id="eyebrow">AI tools · hand-picked</div>
      <h1>Brandon's AI Gifts for You</h1>
    </div>
    <div class="status">
      <a class="pill-btn" href="index.html">← Life Planner</a>
      <button class="pill-btn" id="themeBtn" type="button">Theme</button>
    </div>
  </header>
  <p class="lede"><em>A little library of AI tools, sorted and ready to try.</em> Search by name or what you need, filter by price, and open anything in a new tab.</p>

  <div class="bar">
    <div class="bar-row">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search tools, tags, keywords…" autocomplete="off" aria-label="Search tools">
        <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>✕</button>
      </label>
      <span class="seg-ctl" role="group" aria-label="Price">
        <button data-p="all" class="on" aria-pressed="true">All</button><button data-p="free" aria-pressed="false">Free</button><button data-p="freemium" aria-pressed="false">Freemium</button><button data-p="paid" aria-pressed="false">Paid</button>
      </span>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="Categories"></div>
  </div>

  <main id="list"></main>
  <div class="empty" id="empty" hidden><p>Nothing matches that yet.</p><button class="link-btn" id="reset" type="button">Clear search and filters</button></div>

  <footer>Made with care by Brandon · <a href="index.html">Back to your Life Planner</a></footer>
</div>

<script src="tools.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>{try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:""}catch(e){return ""}};
const TOOLS=(window.TOOLS_DATA||[]).slice().sort((a,b)=>a.name.localeCompare(b.name));
const counts=new Map();TOOLS.forEach(t=>{const c=t.category||"Other";t.category=c;counts.set(c,(counts.get(c)||0)+1)});
const CATS=[...counts.keys()].sort();
TOOLS.forEach(t=>t._s=[t.name,t.tag,t.description,t.keywords,t.category].join(" ").toLowerCase());
let cat="all",price="all",query="";

$("#eyebrow").textContent=`${TOOLS.length} AI tools · ${CATS.length} categories`;
const chipHTML=(k,label,n)=>`<button class="chip ${cat===k?"on":""}" data-c="${esc(k)}" aria-pressed="${cat===k}">${esc(label)}<b>${n}</b></button>`;
function renderChips(){$("#chips").innerHTML=chipHTML("all","Everything",TOOLS.length)+CATS.map(c=>chipHTML(c,c,counts.get(c))).join("")}

function priceOf(t){const p=(t.priceType||"").toLowerCase();return ["free","freemium","paid"].includes(p)?p:"freemium"}
function card(t){
  const url=safeUrl(t.url),p=priceOf(t);
  const kw=(t.keywords||"").split(/\s+/).filter(Boolean).slice(0,4);
  return `<article class="card">
    <div class="card-top"><h3>${esc(t.name)}</h3><span class="price ${p}" title="${esc(t.pricing||p)}">${esc(p)}</span></div>
    ${t.tag?`<p class="tag">${esc(t.tag)}</p>`:""}
    <p class="desc">${esc(t.description||"")}</p>
    ${kw.length?`<div class="kw">${kw.map(k=>`<span>#${esc(k)}</span>`).join("")}</div>`:""}
    <div class="card-foot"><span class="domain">${esc(t.domain||"")}</span>${url?`<a class="visit" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Visit site ↗</a>`:""}</div>
  </article>`;
}
function render(){
  const q=query.trim().toLowerCase();
  const list=TOOLS.filter(t=>(cat==="all"||t.category===cat)&&(price==="all"||priceOf(t)===price)&&(!q||q.split(/\s+/).every(w=>t._s.includes(w))));
  $("#count").textContent=`${list.length} of ${TOOLS.length}`;
  $("#empty").hidden=!!list.length;
  const g=new Map();list.forEach(t=>{if(!g.has(t.category))g.set(t.category,[]);g.get(t.category).push(t)});
  $("#list").innerHTML=[...g.keys()].sort().map(c=>{const ts=g.get(c);return `<section class="cat"><div class="sec-head"><h2>${esc(c)}</h2><span class="meta">${ts.length} ${ts.length===1?"tool":"tools"}</span></div><div class="grid">${ts.map(card).join("")}</div></section>`}).join("");
}
let tq;
$("#q").addEventListener("input",e=>{query=e.target.value;$("#clear").hidden=!query;clearTimeout(tq);tq=setTimeout(render,90)});
$("#clear").addEventListener("click",()=>{$("#q").value="";query="";$("#clear").hidden=true;render();$("#q").focus()});
$("#chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.c;renderChips();render();window.scrollTo({top:Math.min(window.scrollY,$(".bar").offsetTop),behavior:"smooth"})});
document.querySelectorAll(".seg-ctl button").forEach(b=>b.addEventListener("click",()=>{price=b.dataset.p;document.querySelectorAll(".seg-ctl button").forEach(x=>{x.classList.toggle("on",x===b);x.setAttribute("aria-pressed",x===b)});render()}));
$("#reset").addEventListener("click",()=>{cat="all";price="all";query="";$("#q").value="";$("#clear").hidden=true;document.querySelectorAll(".seg-ctl button").forEach(x=>{const on=x.dataset.p==="all";x.classList.toggle("on",on);x.setAttribute("aria-pressed",on)});renderChips();render()});

/* theme toggle, shared with the planner */
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,cur=r.dataset.theme||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  r.dataset.theme=cur==="dark"?"light":"dark";
  try{localStorage.setItem("life-planner-shared-v1-theme",r.dataset.theme)}catch(e){}
});

/* photo theme: reads the backdrop this visitor chose in their planner */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const hsl=(h,s,l,a)=>`hsl(${h} ${Math.round(s*100)}% ${Math.round(l*100)}%${a!=null?" / "+a:""})`;
function themeCSS(p){
  const[ah,as0,al]=p.a,[dh,ds0]=p.d,as=clamp(as0,.35,.8),ds=Math.min(ds0,.4)*.55;
  const dark=`--bg:${hsl(dh,ds,.065)};--surface:${hsl(dh,ds,.098)};--line:${hsl(dh,ds,.19)};--rule:${hsl(dh,ds,.155)};--line-soft:${hsl(dh,ds,.135)};--gold:${hsl(ah,as,clamp(al,.62,.74))};--gold-soft:${hsl(ah,as,clamp(al,.62,.74),.15)};`;
  const light=`--bg:${hsl(dh,ds*.8,.925)};--surface:${hsl(dh,ds*.6,.972)};--line:${hsl(dh,ds*.6,.84)};--rule:${hsl(dh,ds*.6,.865)};--line-soft:${hsl(dh,ds*.6,.895)};--gold:${hsl(ah,as,clamp(al,.3,.38))};--gold-soft:${hsl(ah,as,clamp(al,.3,.38),.12)};`;
  return `:root{${dark}}:root[data-theme="dark"]{${dark}}@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){${light}}}:root[data-theme="light"]{${light}}`;
}
async function applyTheme(S){
  try{
    const th=S&&S.theme;if(!th||th.off)return;
    const ps=(th.photos||[]).filter(p=>p&&p.id);if(!ps.length)return;
    let p;if(th.rotate){const d=new Date(),doy=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5);p=ps[doy%ps.length]}else p=ps[clamp(th.cover|0,0,ps.length-1)];
    const blob=await photoBlob(p.id);if(!blob)return;const img=$("#bannerImg");img.src=await new Promise(ok=>{const f=new FileReader();f.onload=()=>ok(f.result);f.onerror=()=>ok("");f.readAsDataURL(blob)});img.hidden=false;$("#banner").classList.add("has-photo");
    if(p.pal&&p.pal.a&&p.pal.d)$("#photoTheme").textContent=themeCSS(p.pal);
  }catch(e){}
}
function readLocal(){try{const r=localStorage.getItem("life-planner-shared-v1");return r?JSON.parse(r):null}catch(e){return null}}
function photoBlob(id){return new Promise(ok=>{try{const r=indexedDB.open("life-planner-photos",1);r.onupgradeneeded=()=>r.result.createObjectStore("b");r.onerror=()=>ok(null);r.onsuccess=()=>{try{const q=r.result.transaction("b","readonly").objectStore("b").get(id);q.onsuccess=()=>ok(q.result||null);q.onerror=()=>ok(null)}catch(e){ok(null)}}}catch(e){ok(null)}})}
function loadTheme(){applyTheme(readLocal())}
renderChips();render();loadTheme();
})();
</script>
</body>
</html>
